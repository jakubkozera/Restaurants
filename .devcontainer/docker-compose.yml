version: "3.9"

services:
  app:
    image: mcr.microsoft.com/devcontainers/dotnet:1-8.0-jammy
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      sqlserver:
        condition: service_healthy  
    networks:
      - dev-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: YourStrong!Passw0rd
      ACCEPT_EULA: Y
      MSSQL_PID: Express
    # ports:
    #   - 1433:1433
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - dev-network
    healthcheck:                    
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  dev-network:
    driver: bridge

volumes:
  mssql-data: